post:
  tags: [HubWorkflows]
  summary: Publish a local workflow to Hub
  operationId: publishHubWorkflowLocal
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/index.yaml#/HubLocalWorkflowPublishRequest'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/index.yaml#/HubWorkflowPublishResponse'
    '400':
      $ref: '../components/responses.yaml#/BadRequest'
    '401':
      $ref: '../components/responses.yaml#/Unauthorized'
    '403':
      $ref: '../components/responses.yaml#/Forbidden'
    '409':
      $ref: '../components/responses.yaml#/Conflict'
